name: Workspace (independent packages)  # SCD-24..27, standalone

# Per-package CI for SEVEN independent libraries (no uv workspace, no shared root
# config — only .github/ and scripts/ are shared). Resolution is wheelhouse-based:
# a `build-wheelhouse` job builds every package's wheel, and each downstream job
# installs its package (and its cross-package deps) from that wheelhouse with
# `--find-links`. Each package carries its own pyproject tooling + conftest.
#
#   * change-detection is dependency-aware (closure) AND purely dependency-driven:
#     a package runs when its own files change, an upstream pirn dep changes
#     (core → all; data → ml), or shared CI tooling (.github/ or scripts/) changes.
#   * lint/type/test fan out over ONLY the affected packages.
#   * one unified cross-domain suite proves registry parity with all packages
#     installed.
#
# Runs on every PR to main (change-detection fans out to only the affected
# packages) and on push to main (full matrix). Per-package images are built by
# build-ci-image.yml (main push on dep/Dockerfile change + weekly).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  ALL_PACKAGES: '["pirn-core","pirn-signal","pirn-data","pirn-ml","pirn-agents","pirn-health","pirn-oilgas"]'

# The container images are debian-slim where GitHub's default container shell is
# `sh` (dash); force bash so shell substitutions like ${p/pirn-/pirn_} and
# `set -o pipefail` work consistently across all jobs.
defaults:
  run:
    shell: bash

jobs:
  # ===========================================================================
  # Dependency-aware change detection (scripts/workspace_packages.py, PIR-872).
  # The changed-file list is the FULL diff between the PR head and its merge base
  # with the base branch (full-history checkout; nothing is shallow-fetched). A
  # package is affected when its packages/pirn-<x>/ tree changed or a pirn package
  # it depends on is affected (edges read from the pyprojects: core -> all,
  # data -> ml); any change under .github/ or scripts/ affects all seven. The
  # script fails if a package the diff touches is missing from its result.
  #
  # The previous shell implementation piped `printf "$changed" | grep -q` under
  # `set -o pipefail`: grep -q exits at its first match, printf dies of SIGPIPE
  # once the list outgrows the pipe buffer, the pipeline reports failure, and
  # the match reads as "not changed" — PR #368 (83 KB of paths touching all seven
  # packages, .github/ and scripts/) came out as ["pirn-signal","pirn-oilgas"].
  # ===========================================================================
  changes:
    name: Detect affected packages
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.compute.outputs.packages }}
      any: ${{ steps.compute.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Compute affected package set (dependency closure)
        id: compute
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base='${{ github.event.pull_request.base.sha }}'
            head='${{ github.event.pull_request.head.sha }}'
            git fetch --no-tags origin "$base" "$head"
            merge_base="$(git merge-base "$base" "$head")"
            git diff --name-only "$merge_base" "$head" > "$RUNNER_TEMP/changed.txt"
          else
            # push to main / dispatch: an empty list selects every package.
            : > "$RUNNER_TEMP/changed.txt"
          fi
          python3 scripts/workspace_packages.py affected \
            --changed-file "$RUNNER_TEMP/changed.txt" --github-output "$GITHUB_OUTPUT"

  # ===========================================================================
  # Build every package's wheel into one wheelhouse artifact. Each package builds
  # standalone (`uv build <path>`) — no workspace. Downstream jobs install their
  # package's pirn closure from this wheelhouse BY WHEEL PATH
  # (`scripts/workspace_packages.py closure-wheels`): a pirn-* requirement given by
  # name resolves against the public index too, where a published release with a
  # higher version wins over this build.
  # ===========================================================================
  build-wheelhouse:
    name: Build wheelhouse (all packages)
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    container:
      # Mutable tag by design — build-ci-image.yml's header explains why the
      # immutable :py<ver>-<sha> tag is not usable from a consumer (PIR-816).
      image: ghcr.io/${{ github.repository_owner }}/pirn-ci-base:py3.12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build all wheels
        run: |
          set -euo pipefail
          for p in $(echo '${{ env.ALL_PACKAGES }}' | tr -d '[]"' | tr ',' ' '); do
            uv build "packages/$p" -o dist/
          done
          ls -1 dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wheelhouse
          path: dist/
          retention-days: 3

  # ===========================================================================
  # Lint + type-check the affected packages. Ruff is static; pyright runs strict with
  # every import-resolution rule on (no reportMissingImports / reportMissingModuleSource /
  # reportAttributeAccessIssue overrides), against the per-package image that bakes the
  # package with all its non-heavy extras — so an optional backend a module imports under
  # TYPE_CHECKING resolves to real source, and an unresolvable import is an error.
  # ===========================================================================
  lint:
    name: Lint & Type Check (${{ matrix.package }})
    needs: [changes, build-wheelhouse]
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    # Per-package image: that package's deps are pre-baked, so install is instant.
    container:
      image: ghcr.io/${{ github.repository_owner }}/pirn-ci-${{ matrix.package }}:py3.12
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v7.0.0 (match upload-artifact v7; v8 digest-verify mismatched v7 uploads -> stale wheelhouse)
        with: { name: wheelhouse, path: dist/ }
      - name: Resolve import dir
        id: pkg
        run: |
          p='${{ matrix.package }}'
          if [ "$p" = "pirn-core" ]; then imp=pirn; else imp="${p/pirn-/pirn_}"; fi
          echo "imp=$imp" >> "$GITHUB_OUTPUT"
          # Type-check against this build's cross-package code, not the wheel baked
          # into the image: a sibling's annotations (or its py.typed marker) change
          # what pyright sees. Same refresh as the test job.
          deps=$(python3 scripts/workspace_packages.py closure-wheels "$p" --dist dist --exclude-self)
          xr=""; for d in $(python3 scripts/workspace_packages.py closure "$p" --exclude-self); do xr="$xr --reinstall-package $d"; done
          echo "deps=$deps" >> "$GITHUB_OUTPUT"
          echo "xr=$xr" >> "$GITHUB_OUTPUT"
      - name: Install package editable (deps pre-baked) + ruff + pyright
        run: |
          set -euo pipefail
          # Pin BOTH linters (PIR-750): an unpinned install silently rolled ruff to
          # 0.16.0, whose new markdown code-block formatting reddened `format --check`
          # with no source change. pyright is pinned for the same determinism reason —
          # a new release can add checks and redden an unrelated PR. Staying on ruff
          # 0.15.x is deliberate: adopting 0.16.0's markdown formatting is a ~571-file
          # workspace-wide reformat of questionable value, not bundled here. Keep these
          # aligned with .pre-commit-config.yaml.
          uv pip install --system --find-links dist/ ${{ steps.pkg.outputs.xr }} \
            ${{ steps.pkg.outputs.deps }} \
            -e "packages/${{ matrix.package }}" 'ruff==0.15.22' 'pyright==1.1.411'
      - name: Ruff lint + format (package's own config)
        # Run from INSIDE the package, like the pyright step below (PIR-760).
        # Ruff infers first-party packages from the working directory: invoked
        # from the repo root it classified `pirn_agents` as third-party and
        # re-sorted nearly every test file — 397 I001 findings against the 12
        # the documented local gate reports. Source dirs happen to be I001-clean
        # under both classifications, which is the only reason this never bit.
        # cd-ing in also makes CI and the local gate the same command.
        run: |
          cd packages/${{ matrix.package }}
          ruff check ${{ steps.pkg.outputs.imp }}
          ruff format --check ${{ steps.pkg.outputs.imp }}
      - name: Ruff lint + format tests (opt-in per package)
        # PIR-760: the documented local gate lints `tests/`, CI did not, so the
        # two disagreed by construction and findings accumulated unseen.
        # PIR-761 cleaned the five non-core sibling packages' tests/ to zero
        # findings and opted each in, then finished pirn-core (its tests/ F821
        # were missing typing imports in stringized annotations, not the PIR-762
        # signal once feared — added the imports; every other finding fixed or
        # honestly scoped). All seven packages are now in. Keep this opt-in — add
        # a package here only once its tests/ pass; do not add one speculatively,
        # a red main helps nobody.
        if: contains(fromJSON('["pirn-core","pirn-agents","pirn-signal","pirn-data","pirn-ml","pirn-health","pirn-oilgas"]'), matrix.package)
        run: |
          cd packages/${{ matrix.package }}
          ruff check tests
          ruff format --check tests
      - name: Pyright (package's own config)
        run: cd packages/${{ matrix.package }} && pyright

  # ===========================================================================
  # Per-package test matrix × Python 3.11–3.14. Editable-install the package with
  # its extras (heavy ML extras dropped for core) + cross-deps from the wheelhouse,
  # then run its own tests under its own config. `cross_domain` tests skip here.
  # ===========================================================================
  test:
    name: Test ${{ matrix.package }} (py${{ matrix.python-version }})
    needs: [changes, build-wheelhouse, lint]
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    # Per-package image: deps + extras pre-baked, so install is near-instant.
    container:
      image: ghcr.io/${{ github.repository_owner }}/pirn-ci-${{ matrix.package }}:py${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v7.0.0 (match upload-artifact v7; v8 digest-verify mismatched v7 uploads -> stale wheelhouse)
        with: { name: wheelhouse, path: dist/ }
      - name: Compute install spec (extras minus heavy ML) + cross-dep refresh
        id: spec
        run: |
          set -euo pipefail
          p='${{ matrix.package }}'
          if [ "$p" = "pirn-core" ]; then imp=pirn; else imp="${p/pirn-/pirn_}"; fi
          echo "imp=$imp" >> "$GITHUB_OUTPUT"
          # Extras minus the heavy ML ones and any extra that pulls another pirn
          # distribution (core's all-domains), which would resolve from the index.
          extras=$(python3 scripts/workspace_packages.py test-extras "${{ matrix.package }}")
          if [ -n "$extras" ]; then echo "spec=packages/${{ matrix.package }}[$extras]" >> "$GITHUB_OUTPUT";
          else echo "spec=packages/${{ matrix.package }}" >> "$GITHUB_OUTPUT"; fi
          # Force-refresh cross-package deps with this build's wheels, by path.
          deps=$(python3 scripts/workspace_packages.py closure-wheels "$p" --dist dist --exclude-self)
          xr=""; for d in $(python3 scripts/workspace_packages.py closure "$p" --exclude-self); do xr="$xr --reinstall-package $d"; done
          echo "deps=$deps" >> "$GITHUB_OUTPUT"
          echo "xr=$xr" >> "$GITHUB_OUTPUT"
          # Core connector extras some domain test suites exercise (the per-package
          # image bakes only that domain's own extras, not core's).
          case "${{ matrix.package }}" in
            pirn-data)   cte="pirn-core[sqlite]" ;;
            pirn-agents) cte="pirn-core[http]" ;;
            *)           cte="" ;;
          esac
          echo "cte=$cte" >> "$GITHUB_OUTPUT"
      - name: Install editable (deps pre-baked) + refresh cross-deps + test tooling
        run: |
          set -euo pipefail
          # The cross-deps' wheels are given by path, so the pirn-core[...] extra
          # below binds to this build's pirn-core, never an index release.
          uv pip install --system --find-links dist/ ${{ steps.spec.outputs.xr }} \
            ${{ steps.spec.outputs.deps }} \
            -e "${{ steps.spec.outputs.spec }}" ${{ steps.spec.outputs.cte }} \
            pytest pytest-asyncio pytest-cov pytest-timeout anyio
      - name: Run tests (own config) + per-package coverage
        run: |
          cd packages/${{ matrix.package }}
          python -m pytest tests --timeout=60 -q \
            --cov=${{ steps.spec.outputs.imp }} --cov-report=xml:coverage.xml
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: packages/${{ matrix.package }}/coverage.xml
          flags: ${{ matrix.package }}
          name: ${{ matrix.package }}
          fail_ci_if_error: false

  # ===========================================================================
  # Slow-marked tests per affected package (PIR-872). Every package's addopts
  # deselects `slow`, so the `test` job never runs them; this job runs exactly
  # `-m slow` with the same extras (minus heavy ML) on py3.12. A package with no
  # slow tests exits 5 (nothing collected) and passes. Any skipped slow test
  # FAILS the job: a slow test that skips on a missing backend is not running.
  # ===========================================================================
  slow-tests:
    name: Slow tests (${{ matrix.package }})
    needs: [changes, build-wheelhouse, lint]
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/pirn-ci-${{ matrix.package }}:py3.12
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v7.0.0 (match upload-artifact v7; v8 digest-verify mismatched v7 uploads -> stale wheelhouse)
        with: { name: wheelhouse, path: dist/ }
      - name: Compute install spec (extras minus heavy ML) + cross-dep refresh
        id: spec
        run: |
          set -euo pipefail
          p='${{ matrix.package }}'
          # Extras minus the heavy ML ones and any extra that pulls another pirn
          # distribution (core's all-domains), which would resolve from the index.
          extras=$(python3 scripts/workspace_packages.py test-extras "${{ matrix.package }}")
          if [ -n "$extras" ]; then echo "spec=packages/$p[$extras]" >> "$GITHUB_OUTPUT";
          else echo "spec=packages/$p" >> "$GITHUB_OUTPUT"; fi
          deps=$(python3 scripts/workspace_packages.py closure-wheels "$p" --dist dist --exclude-self)
          xr=""; for d in $(python3 scripts/workspace_packages.py closure "$p" --exclude-self); do xr="$xr --reinstall-package $d"; done
          echo "deps=$deps" >> "$GITHUB_OUTPUT"
          echo "xr=$xr" >> "$GITHUB_OUTPUT"
          case "$p" in
            pirn-data)   cte="pirn-core[sqlite]" ;;
            pirn-agents) cte="pirn-core[http]" ;;
            *)           cte="" ;;
          esac
          echo "cte=$cte" >> "$GITHUB_OUTPUT"
      - name: Install a JVM for the Spark slow tests
        # pirn-data's slow suite boots a local SparkSession (the `spark` extra);
        # pyspark needs a Java runtime the base image does not carry.
        if: matrix.package == 'pirn-data'
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends default-jre-headless
          java -version
      - name: Install editable (deps pre-baked) + refresh cross-deps + test tooling
        run: |
          set -euo pipefail
          # The cross-deps' wheels are given by path, so the pirn-core[...] extra
          # below binds to this build's pirn-core, never an index release.
          uv pip install --system --find-links dist/ ${{ steps.spec.outputs.xr }} \
            ${{ steps.spec.outputs.deps }} \
            -e "${{ steps.spec.outputs.spec }}" ${{ steps.spec.outputs.cte }} \
            pytest pytest-asyncio pytest-timeout anyio
      - name: Run slow tests (fail on any failure or skip)
        run: |
          # GitHub runs bash with -e; turn it off so exit code 5 (nothing collected) is inspected.
          set +e -uo pipefail
          cd packages/${{ matrix.package }}
          python -m pytest tests -m slow --timeout=600 -q -rs --junitxml=slow-results.xml
          rc=$?
          if [ "$rc" -eq 5 ]; then
            echo "no slow-marked tests in ${{ matrix.package }}"
            exit 0
          fi
          [ "$rc" -eq 0 ] || exit "$rc"
          python3 -c "import sys, xml.etree.ElementTree as E; r=E.parse('slow-results.xml').getroot(); s=sum(int(x.get('skipped', 0)) for x in r.iter('testsuite')); print(f'skipped slow tests: {s}'); sys.exit(1 if s else 0)"

  # ===========================================================================
  # Clean-env install-isolation (SCD-25). Install ONLY the package's wheel from
  # the wheelhouse, assert the resolved pirn-* tree equals the declared closure,
  # then import EVERY submodule of the package: each must import without any
  # extra, and no optional backend outside the package's hard-dependency closure
  # may end up imported (scripts/check_install_isolation.py, every package).
  # ===========================================================================
  install-isolation:
    name: Install isolation (${{ matrix.package }})
    needs: [changes, build-wheelhouse]
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/pirn-ci-base:py3.12
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v7.0.0 (match upload-artifact v7; v8 digest-verify mismatched v7 uploads -> stale wheelhouse)
        with: { name: wheelhouse, path: dist/ }
      - name: Clean-env install + dependency-tree closure gate
        run: |
          set -euo pipefail
          p='${{ matrix.package }}'
          uv venv /tmp/iso
          # This build's wheels for the package and its pirn closure, by path: by
          # name, uv resolved the published release from the index (0.10.0 over the
          # wheelhouse's 0.9.0) and the gate checked that instead of the PR.
          wheels=$(python3 scripts/workspace_packages.py closure-wheels "$p" --dist dist)
          uv pip install --python /tmp/iso/bin/python --find-links dist/ $wheels
          /tmp/iso/bin/python scripts/check_install_isolation.py --package "$p" \
            --expect-version "$(python3 scripts/workspace_packages.py version "$p")"

  # ===========================================================================
  # Per-extra clean-venv install+import (PIR-137). For each pirn-agents extra
  # bundle, create a CLEAN venv, install ONLY `pirn-agents[<extra>]` from the
  # wheelhouse, then import the package and confirm the extra's backends are now
  # available. Complements `install-isolation` (which proves the BASE install
  # stays backend-free) by proving each extra actually pulls its backends in.
  # ===========================================================================
  agents-extras-install:
    name: Install extras (pirn-agents [${{ matrix.extra }}])
    needs: [changes, build-wheelhouse]
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/pirn-ci-base:py3.12
    strategy:
      fail-fast: false
      matrix:
        extra: [llm, vector, web, mcp, all]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v7.0.0 (match upload-artifact v7; v8 digest-verify mismatched v7 uploads -> stale wheelhouse)
        with: { name: wheelhouse, path: dist/ }
      - name: Clean-env install of pirn-agents[${{ matrix.extra }}] + import probe
        run: |
          set -euo pipefail
          uv venv /tmp/extra
          # Install pirn-agents from the SOURCE tree (not by name) so this PR's
          # code + extras are exercised: installing `pirn-agents[<extra>]` by name
          # can resolve to an already-published same-version wheel on PyPI that
          # lacks the extra. pirn-core is this build's wheel, by path; backends from PyPI.
          uv pip install --python /tmp/extra/bin/python --find-links dist/ \
            $(python3 scripts/workspace_packages.py closure-wheels pirn-agents --dist dist --exclude-self) \
            "packages/pirn-agents[${{ matrix.extra }}]"
          /tmp/extra/bin/python -c "import importlib.metadata as m, sys; v = m.version('pirn-core'); want = sys.argv[1]; assert v == want, (v, want)" \
            "$(python3 scripts/workspace_packages.py version pirn-core)"
          /tmp/extra/bin/python -c "from pirn_agents.capability_probe import CapabilityProbe; print(CapabilityProbe().available_extras())"

  # ===========================================================================
  # Unified cross-domain suite (SCD-24 AC#3): install every package from the
  # wheelhouse, run the `cross_domain` registry-parity / extras-isolation
  # tests under core's config.
  # ===========================================================================
  unified:
    name: Unified cross-domain suite (registry parity)
    needs: [changes, build-wheelhouse]
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/pirn-ci-base:py3.12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v7.0.0 (match upload-artifact v7; v8 digest-verify mismatched v7 uploads -> stale wheelhouse)
        with: { name: wheelhouse, path: dist/ }
      - name: Install all packages (from wheelhouse) + test tooling
        run: |
          set -euo pipefail
          uv venv .venv
          # Install the pirn packages by explicit local wheel PATH, not by name.
          # Lockstep versioning stamps published wheels to a higher version than
          # the unstamped source build here, so installing by name lets uv pick
          # the stale published version off the index over the fresh wheelhouse
          # wheel (SCD-24 latent bug: a PR that adds/renames a module then fails
          # to import it). By-path pins the fresh local build; --find-links + the
          # index still resolve their third-party deps and the test tooling.
          uv pip install --find-links dist/ \
            dist/pirn_core-*.whl dist/pirn_signal-*.whl dist/pirn_data-*.whl \
            dist/pirn_ml-*.whl dist/pirn_agents-*.whl dist/pirn_health-*.whl \
            dist/pirn_oilgas-*.whl \
            pytest pytest-asyncio pytest-timeout anyio
      - name: Cross-domain registry-parity / extras-isolation
        run: |
          uv run --no-sync python -m pytest packages/pirn-core/tests \
            -c packages/pirn-core/pyproject.toml --rootdir packages/pirn-core \
            -m "cross_domain and not slow and not heavy" -q

  # ===========================================================================
  # Import-graph gate (C1 acyclic · C2 sink · C3 sole edge · no-backend). Static.
  # ===========================================================================
  import-graph:
    name: Import-graph gate
    needs: [changes, build-wheelhouse]
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/pirn-ci-base:py3.12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v7.0.0 (match upload-artifact v7; v8 digest-verify mismatched v7 uploads -> stale wheelhouse)
        with: { name: wheelhouse, path: dist/ }
      - name: Install bare pirn-core (this build's wheel, by path)
        run: |
          set -euo pipefail
          uv venv .venv
          uv pip install --find-links dist/ $(python3 scripts/workspace_packages.py closure-wheels pirn-core --dist dist)
      - name: Core is a sink, no backend at import, package DAG acyclic
        run: uv run --no-sync python scripts/check_import_graph.py

  # ===========================================================================
  # No-import-forwarding gate (python.md:42). Pure stdlib AST over every
  # __init__.py — no install, so it does not wait on the wheelhouse.
  #
  # Repo-wide rather than per-package on purpose: the `test`/`lint` matrix only
  # runs for packages the change-detection marked affected, so a re-export
  # reintroduced in an untouched package would be skipped. This gate is a
  # millisecond AST scan, so sharding it across the 7-way matrix would buy
  # nothing and cost 7 container starts. It was pre-commit-only until now, which
  # is how PIR-737's cleanup was silently regressed twice in one day by anyone
  # committing with --no-verify or without hooks installed.
  # ===========================================================================
  import-forwarding:
    name: No-import-forwarding gate
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/pirn-ci-base:py3.12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: No __init__.py re-exports an unused symbol
        # Directory args are walked for __init__.py. The script exits 2 if a path
        # is missing or matches nothing, so a future miswiring fails loudly
        # instead of passing vacuously. Stdlib-only — no install needed.
        run: python scripts/check_no_import_forwarding.py packages/ examples/ scripts/
      - name: House-convention AST gate (PIR-856)
        # Stdlib-only, source-only (packages/*/pirn*/**/*.py; tests/ excluded).
        # No baseline: any finding of any rule fails.
        run: >
          python scripts/check_conventions.py
          packages/pirn-core/pirn packages/pirn-agents/pirn_agents
          packages/pirn-data/pirn_data packages/pirn-health/pirn_health
          packages/pirn-ml/pirn_ml packages/pirn-oilgas/pirn_oilgas
          packages/pirn-signal/pirn_signal
      - name: No UPPER_SNAKE constants (PIR-856)
        # Same package source trees as above; any finding fails.
        run: >
          python scripts/check_no_caps_constants.py
          packages/pirn-core/pirn packages/pirn-agents/pirn_agents
          packages/pirn-data/pirn_data packages/pirn-health/pirn_health
          packages/pirn-ml/pirn_ml packages/pirn-oilgas/pirn_oilgas
          packages/pirn-signal/pirn_signal
      - name: Install pytest (base image ships python + uv only)
        # Floor matches every package's own pytest requirement.
        run: uv pip install --system 'pytest>=9.1.0'
      - name: Gate's own unit tests
        # scripts/tests/ ran in no workflow before this job existed — the checker
        # that guards the convention had no CI coverage of its own.
        run: python -m pytest scripts/tests/ -q

  # ===========================================================================
  # Lockstep / C4 version gate (SCD-27). Pure stdlib over the package pyprojects.
  # ===========================================================================
  version-lockstep:
    name: Lockstep + C4 version gate
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/pirn-ci-base:py3.12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: All packages lockstep-versioned; pins floored + capped (C4)
        run: python scripts/stamp_workspace_version.py --check

  # ===========================================================================
  # Single aggregator gate — the one stable, required status check for branch
  # protection (matrix job names are dynamic). Green only if every needed job
  # succeeded or was legitimately skipped (change-detection found nothing).
  # ===========================================================================
  ci-status:
    name: CI status (all green)
    needs: [changes, build-wheelhouse, lint, test, slow-tests, install-isolation, agents-extras-install, unified, import-graph, import-forwarding, version-lockstep]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any needed job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::one or more CI jobs failed"
          exit 1
      - name: All green
        run: echo "all required jobs succeeded (or were skipped by change-detection)"
