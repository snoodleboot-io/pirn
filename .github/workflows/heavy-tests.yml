name: Heavy Tests

# Heavy ML tests (torch/tensorflow) are slow — run nightly + on demand.
on:
  schedule:
    - cron: '0 4 * * *'   # nightly heavy ML suite
  workflow_dispatch:

concurrency:
  group: heavy-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  UV_PYTHON_PREFERENCE: only-system

# Container images are debian-slim (default shell `sh`); force bash.
defaults:
  run:
    shell: bash

jobs:
  approve:
    name: Approve Heavy Tests
    runs-on: ubuntu-latest
    # PIR-845: the approval gate applies to workflow_dispatch only. A cron run has
    # no human present to approve it, so the gate timed out and every scheduled run
    # ended `cancelled` — 129 in a row, none ever executed — and a cancelled run
    # does not turn a dashboard red, so the suite looked fine while never running.
    # The scheduled run is the one that must not need a person, so it skips this job
    # (and with it the environment); a manual dispatch still waits for approval.
    # Neither suite reads any secret, so nothing is lost by skipping the
    # environment on the schedule path. cron-health.yml alerts if it ever regresses.
    if: github.event_name != 'schedule'
    environment: heavy
    steps:
      - run: echo "Approved — running heavy tests across all Python versions"

  heavy-tests:
    name: Heavy Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [approve]
    # approve is skipped on schedule, and a skipped need skips its dependents by
    # default — so run when it succeeded OR was skipped, never when it was rejected.
    if: ${{ !cancelled() && (needs.approve.result == 'success' || needs.approve.result == 'skipped') }}
    container:
      image: ghcr.io/${{ github.repository_owner }}/pirn-ci-heavy:py${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build wheelhouse + install core & ml (+ heavy ML deps)
        run: |
          set -euo pipefail
          for p in pirn-core pirn-data pirn-ml; do uv build "packages/$p" -o dist/; done
          uv venv .venv
          uv pip install --find-links dist/ -e packages/pirn-core -e packages/pirn-data -e packages/pirn-ml \
            torch tensorflow pytest pytest-timeout anyio || \
          uv pip install --find-links dist/ -e packages/pirn-core -e packages/pirn-data -e packages/pirn-ml \
            torch pytest pytest-timeout anyio

      - name: Run heavy tests (core + ml, marked heavy)
        run: |
          mkdir -p test-results
          for pkg in pirn-core pirn-ml; do
            uv run --no-sync python -m pytest "packages/$pkg/tests" \
              -c "packages/$pkg/pyproject.toml" --rootdir "packages/$pkg" \
              -m heavy \
              --junitxml="test-results/heavy-$pkg-${{ matrix.python-version }}.xml" \
              --timeout=120 -v
          done

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: test-results-heavy-${{ matrix.python-version }}
          path: test-results/heavy-${{ matrix.python-version }}.xml
          retention-days: 30
