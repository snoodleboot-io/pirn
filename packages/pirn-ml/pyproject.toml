# pirn-ml — the ML Engineering / Data Science domain, imports as `pirn_ml`
# (SCD-14, Phase 3). Source relocated from `pirn/domains/ml` to `pirn_ml/`;
# the `ml` extra (numpy/pandas/scikit-learn) moved here from pirn-core. This
# package carries the one retained domain→domain edge (`pirn-ml → pirn-data`,
# ADR-3): dataset_loader consumes DataBatch/LakehouseTable/FileSource/SqlSource
# from pirn_data. ML-artefact codecs (onnx/pytorch/tensorflow) remain core
# connector file-format extras.
[build-system]
# hatchling is pinned to ONE minor on purpose (PIR-806, relaxed by PIR-828).
#
# The window decides the emitted `Metadata-Version`, so it is build output, not a
# convenience bound. 1.30.1..1.31.x emit 2.4; 1.32.0 emits 2.5. PIR-806 had to cap
# below 1.32 because the twine 6.1.0 / packaging 25.0 inside the pinned
# pypa/gh-action-pypi-publish rejected 2.5 outright. Bumping that action to 1.14.2
# (PR #234) moved it to twine 7.0.0 / packaging 26.2, which accepts 2.5 — verified
# by running `twine check` on a 2.5 wheel under both pin sets, and by installing
# one with pip 24.0, 24.3.1, 25.0 and 25.2.
#
# The bound stays one minor wide rather than becoming `<2`, because hatchling's
# metadata behaviour is demonstrably NON-MONOTONIC: 1.30.0 emitted 2.5, 1.30.1
# reverted to 2.4, 1.32.0 reintroduced it. A wider range would let the same source
# emit either version depending on what resolution happened to pick — the exact
# nondeterminism this pin exists to prevent. Re-measure before widening it.
requires = ["hatchling>=1.32.0,<1.33"]
build-backend = "hatchling.build"

[project]
name = "pirn-ml"
version = "0.9.0"                          # lockstep (ADR-6)
description = "pirn machine-learning domain knots."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pirn-core>=0.9.0,<0.10.0",             # lockstep floor (ADR-6 / constraint C4)
    "pirn-data>=0.9.0,<0.10.0",             # retained domain edge (ADR-3)
]

[project.optional-dependencies]
# Core ML stack — the orchestration layer imports without these; concrete
# knots check via pirn_ml.extras_loader.ExtrasLoader.
ml = ["numpy>=1.26", "pandas>=2.0", "scikit-learn>=1.4"]

[tool.hatch.build.targets.wheel]
packages = ["pirn_ml"]

# --- standalone tooling: pirn-ml owns its full config (no shared root) ---

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "anyio>=4.0",
    "ruff>=0.15.17",
    "pyright>=1.1.410",
    "mutmut>=3.6.0,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers -ra -m 'not slow and not mutation and not heavy'"
markers = [
    "slow: tests that take meaningful wall-clock time",
    "mutation: mutation-test-specific assertions",
    "heavy: requires large ML deps (torch, tensorflow) — excluded from the default suite",
    "cross_domain: needs >1 package installed — skipped in isolation, run by the unified suite",
    "anyio: async test driven by the anyio pytest plugin (registered so --strict-markers passes if absent)",
    "needs_postgres: requires a real Postgres at $PIRN_TEST_POSTGRES_URL",
    "needs_valkey: requires a real ValKey at $PIRN_TEST_VALKEY_URL",
    "needs_kafka: requires a real Kafka at $PIRN_TEST_KAFKA_URL",
    "needs_s3: requires a real S3 (or compatible) endpoint",
    "needs_dask: requires dask.distributed (uses LocalCluster)",
    "needs_ray: requires ray (uses a local Ray instance)",
    "needs_celery: requires celery + Redis broker at $PIRN_TEST_CELERY_BROKER",
    "benchmark: pytest-benchmark performance test",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["F841"]

[tool.coverage.run]
source = ["pirn_ml"]

[tool.mutmut]
paths_to_mutate = "pirn_ml/"
tests_dir = "tests/"
runner = ".venv/bin/python -m pytest tests -x -q --no-header"

[tool.pyright]
# Pin type resolution to the workspace venv (PIR-814). Without venvPath/venv,
# pyright resolves whichever interpreter the shell happens to hand it -- an
# active VIRTUAL_ENV, else the bare system python -- so the same source yields
# different diagnostics depending on where you invoked it from. Pointing it at
# the workspace root venv makes `cd packages/<pkg> && pyright` reproducible.
venvPath = "../.."
venv = ".venv"
include = ["pirn_ml"]
pythonVersion = "3.12"
reportMissingImports = "none"
reportMissingModuleSource = "none"
# reportIncompatibleMethodOverride is ON (PIR-833). It used to be "none" in all
# seven packages, which hid real substitutability breaks among ~730 framework
# false positives. Those are gone at the source: Knot — and every abstract
# mid-tree base that only narrows the return type — declares process() in the
# gradual parameter form (*args, **kwargs), which drops the parameter half of
# the check for dynamically-bound named inputs and keeps the return half.
reportIncompatibleMethodOverride = "error"
reportAttributeAccessIssue = "none"
