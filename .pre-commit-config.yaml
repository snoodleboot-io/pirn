# Version note (PIR-750): ruff is pinned to v0.15.22 to match the CI pin in
# .github/workflows/workspace.yml. Staying on 0.15.x is deliberate — 0.16.0 formats
# markdown code blocks, a ~571-file workspace-wide reformat we have not adopted. The
# `ruff`/`ruff-format`/`pyright` hooks below run out of `.venv/bin/` (see PIR-856
# layout note) rather than a pinned separate hook environment, so keeping `.venv`'s
# ruff/pyright versions aligned with the CI pins is what keeps local and CI in
# lockstep now — there is no `rev:` to bump here anymore.
#
# Layout note (PIR-856): this is a monorepo of `packages/<dist>/<import_pkg>/…`
# packages, each with its OWN `pyproject.toml` config — there is no shared root
# config. The hooks below used to match `files: ^pirn/`, which never matches that
# layout, so they were effectively inert locally (CI was the only real enforcement
# point). They are now scoped to `^packages/[^/]+/pirn` (matches every package's
# import root: `pirn`, `pirn_agents`, `pirn_data`, …). `ruff`/`ruff-format`/`pyright`
# go through small wrapper scripts (`scripts/precommit_ruff.py`,
# `scripts/precommit_pyright.py`) that group the staged files by the package they
# live under and invoke the tool once per package with THAT package's own config —
# running ruff from the repo root without doing this once reformatted 560 files
# across every package, including pirn-core. `check_conventions.py` and
# `check_no_caps_constants.py` scan whole package trees rather than individual
# files, so they run over all seven unconditionally whenever a matching file
# changed (`pass_filenames: false`) — both are pure-AST and fast. The
# no-import-forwarding hook uses a layout-independent pattern and always ran.
#
# Shared-tree note (PIR-873): every hook above matches `^packages/…` only, so a commit
# touching just `docs/`, `examples/` or `scripts/` ran nothing here — the same hole the
# CI workflow had (a docs/examples-only PR skipped every gate job and the aggregator
# went green anyway). The last two hooks close the local half: the documentation
# import gate and ruff over the two shared trees, which carry their own
# `scripts/ruff.toml` / `examples/ruff.toml` and are checked from INSIDE each tree for
# the same cwd-relative first-party-classification reason as the per-package wrapper.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (per-package config)
        entry: python scripts/precommit_ruff.py check
        language: system
        types: [python]
        files: ^packages/[^/]+/pirn

      - id: ruff-format
        name: ruff format (per-package config)
        entry: python scripts/precommit_ruff.py format
        language: system
        types: [python]
        files: ^packages/[^/]+/pirn

      - id: pyright
        name: pyright (per-package)
        entry: python scripts/precommit_pyright.py
        language: system
        types: [python]
        files: ^packages/[^/]+/pirn

      - id: check-conventions
        name: house-convention AST gate
        entry: >
          python scripts/check_conventions.py
          packages/pirn-core/pirn packages/pirn-agents/pirn_agents
          packages/pirn-data/pirn_data packages/pirn-health/pirn_health
          packages/pirn-ml/pirn_ml packages/pirn-oilgas/pirn_oilgas
          packages/pirn-signal/pirn_signal
        language: system
        types: [python]
        pass_filenames: false
        files: ^packages/[^/]+/pirn

      - id: no-caps-constants
        name: no UPPER_SNAKE constants
        entry: >
          python scripts/check_no_caps_constants.py
          packages/pirn-core/pirn packages/pirn-agents/pirn_agents
          packages/pirn-data/pirn_data packages/pirn-health/pirn_health
          packages/pirn-ml/pirn_ml packages/pirn-oilgas/pirn_oilgas
          packages/pirn-signal/pirn_signal
        language: system
        types: [python]
        pass_filenames: false
        files: ^packages/[^/]+/pirn

      - id: no-import-forwarding
        name: no import forwarding in __init__.py
        entry: python scripts/check_no_import_forwarding.py
        language: system
        files: (^|/)__init__\.py$
        exclude: ^(tests|examples)/

      - id: check-doc-imports
        name: documentation imports resolve
        # Same invocation as the `workspace-gates` CI job. Stdlib-only and static
        # (nothing is imported); it reads the markdown AND the package source, so a
        # source rename must re-run it, not just a markdown edit.
        entry: >
          python scripts/check_doc_imports.py
          AGENTIC_USE.md AGENTIC_USE_SPEC.md README.md docs examples/README.md packages
        language: system
        pass_filenames: false
        files: (\.md$|^packages/[^/]+/pirn)

      - id: ruff-shared-trees
        name: ruff (scripts/ and examples/, each from inside)
        # `scripts/` and `examples/` have no package pyproject, so the per-package
        # wrapper above never covers them; they carry their own ruff.toml. Run from
        # INSIDE each tree — ruff's first-party import classification is cwd-relative
        # and this repo has no root config (PIR-760).
        entry: bash -c 'set -e; (cd scripts && ruff check . && ruff format --check .); (cd examples && ruff check . && ruff format --check .)'
        language: system
        types: [python]
        pass_filenames: false
        files: ^(scripts|examples)/

      - id: stamp-agentic-use-version
        name: stamp AGENTIC_USE.md major version
        entry: python scripts/stamp_agentic_use_version.py
        language: system
        pass_filenames: false
        always_run: true
